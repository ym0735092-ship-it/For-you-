<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Menna ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #03040b;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;
let particles = [];
let phase = 0;
let startTime = Date.now();

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

const COUNT = 1600;

// Create heart positions
function heartPoints() {
    let points = [];

    for (let i = 0; i < COUNT; i++) {
        let t = Math.random() * Math.PI * 2;

        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t)
              - 5 * Math.cos(2*t)
              - 2 * Math.cos(3*t)
              - Math.cos(4*t);

        let scale = Math.min(W, H) * 0.020;

        points.push({
            x: W/2 + x * scale,
            y: H/2 - y * scale
        });
    }

    return points;
}

// Create MENNA text positions
function textPoints() {
    let off = document.createElement("canvas");
    let c = off.getContext("2d");

    off.width = W;
    off.height = H;

    c.fillStyle = "white";
    c.textAlign = "center";
    c.textBaseline = "middle";

    let size = Math.min(W * 0.19, H * 0.20);
    c.font = `bold ${size}px Arial`;
    c.fillText("MENNA", W/2, H/2);

    let data = c.getImageData(0, 0, W, H).data;
    let points = [];

    for (let y = 0; y < H; y += 4) {
        for (let x = 0; x < W; x += 4) {
            if (data[(y * W + x) * 4 + 3] > 100) {
                points.push({x, y});
            }
        }
    }

    return points;
}

let heart = heartPoints();
let name = textPoints();

// Initialize particles
for (let i = 0; i < COUNT; i++) {
    particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: Math.random() * 0.04 + 0.01,
        size: Math.random() * 1.8 + 0.5,
        angle: Math.random() * Math.PI * 2
    });
}

function animate() {
    requestAnimationFrame(animate);

    let elapsed = (Date.now() - startTime) / 1000;

    // Heart first, then MENNA
    if (elapsed > 8) {
        phase = 1;
    }

    let targets = phase === 0 ? heart : name;

    ctx.fillStyle = "rgba(3, 4, 11, 0.18)";
    ctx.fillRect(0, 0, W, H);

    // Blue glowing base
    let baseY = H * 0.77;

    let glow = ctx.createRadialGradient(
        W/2, baseY, 2,
        W/2, baseY, 65
    );

    glow.addColorStop(0, "rgba(0,180,255,0.8)");
    glow.addColorStop(0.5, "rgba(0,80,255,0.3)");
    glow.addColorStop(1, "rgba(0,0,255,0)");

    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.ellipse(W/2, baseY, 85, 15, 0, 0, Math.PI*2);
    ctx.fill();

    // Animate particles
    particles.forEach((p, i) => {
        let target = targets[i % targets.length];

        p.angle += 0.015;

        let waveX = Math.sin(p.angle) * 2;
        let waveY = Math.cos(p.angle) * 2;

        p.x += (target.x + waveX - p.x) * p.speed;
        p.y += (target.y + waveY - p.y) * p.speed;

        let alpha = 0.5 + Math.random() * 0.5;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

        ctx.fillStyle = `rgba(0, ${150 + Math.random()*100}, 255, ${alpha})`;

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#008cff";
        ctx.fill();

        ctx.shadowBlur = 0;
    });

    // Floating particles around the heart/name
    for (let i = 0; i < 12; i++) {
        let x = Math.random() * W;
        let y = Math.random() * H;

        ctx.fillStyle = "rgba(0,160,255,0.5)";
        ctx.fillRect(x, y, 2, 2);
    }
}

// Regenerate positions on screen resize
window.addEventListener("resize", () => {
    heart = heartPoints();
    name = textPoints();
});

animate();
</script>
</body>
</html>
